# Perfil local con H2 en modo compatibilidad PostgreSQL (útil cuando Docker Desktop no está iniciado)
spring:
  datasource:
    url: jdbc:h2:mem:lumina_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
