server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: lumina-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lumina_db}
    username: ${DB_USERNAME:lumina_user}
    password: ${DB_PASSWORD:lumina_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Documentación OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Configuración personalizada de la tienda
lumina:
  brand:
    name: "Lúmina"
    currency: "COP"
    tax-included: true
    default-vat-rate: 0.19
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
